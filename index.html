<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>amcoms</title>
    <style>
      .startup-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      .startup-spinner {
        width: 2rem;
        height: 2rem;
        margin: 0 auto 1rem;
        border: 3px solid #dbeafe;
        border-top-color: #1e40af;
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }
      @keyframes startup-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="startup-screen" role="status" aria-live="polite">
        <div>
          <div class="startup-spinner" aria-hidden="true"></div>
          <p>Loading AMCOMS…</p>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
